[package]
name = "rustengine"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
protobuf = "3.2" # Matches C++ ParseFromArray style
glam = "0.24"    # Standard Rust crate for vector math (replaces QVector2D)
iced = { version = "0.13", features = ["canvas", "tokio"] }
nalgebra = "0.33" # Álgebra lineal para Kalman (similar a Eigen en C++)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
mlua = { version = "0.9", features = ["luajit", "async", "vendored"] } # Lua bindings con async support (LuaJIT, compilado desde fuente)
tracing = "0.1"

[build-dependencies]
protobuf-codegen = "3" # Tool to generate Rust code from .proto files